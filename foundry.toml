[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
# Testnet only. No deployments are performed by this repo yet.
robinhood_testnet = "${RH_TESTNET_RPC}"

[lint]
lint_on_build = false
