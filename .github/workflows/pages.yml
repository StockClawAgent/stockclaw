# Publishes the static front end (prototype/) to GitHub Pages in sample-data mode. No secrets, no backend.
name: pages
on:
  push:
    branches: [main]
    paths: ["prototype/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage site (prototype/ only, sample data forced)
        run: |
          cp -R prototype _site
          rm -rf _site/png
          find _site \( -name '*.md' -o -name '.*' \) -type f -delete
          printf 'window.STOCKCLAW_PUBLIC=true;window.STOCKCLAW_USE_MOCK=true;\n' > _site/config.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
